<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Kiểm tra luồng CSI</title>
<style>
  body { font: 16px system-ui; background: #f4f7fa; color: #172033; margin: 0 auto; max-width: 960px; padding: 24px; }
  header, section { background: white; border: 1px solid #d6deea; border-radius: 8px; padding: 18px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-top: 16px; }
  h1, h2 { margin: 0 0 12px; }
  button { font: inherit; padding: 6px 12px; margin-right: 6px; }
  svg { width: 100%; display: block; background: #eef3f8; border-radius: 6px; }
  output { display: block; margin-top: 10px; overflow-wrap: anywhere; }
</style>
<header>
  <h1>Kiểm tra luồng CSI</h1>
  <button id="start" type="button">Bắt đầu phiên</button>
  <button id="stop" type="button">Dừng phiên</button>
  <output id="status" aria-live="polite">Đang kết nối WebSocket</output>
  <output id="detail"></output>
</header>
<main>
  <section>
    <h2>Biên độ CSI trung bình</h2>
    <svg id="chart" viewBox="0 0 360 200" role="img" aria-label="Biểu đồ biên độ CSI"></svg>
    <output id="chart-range"></output>
  </section>
  <section>
    <h2>Tư thế 2D</h2>
    <svg id="pose" viewBox="0 0 360 202.5" role="img" aria-label="Tọa độ khớp 2D"></svg>
    <output id="presence">Chưa có kết quả</output>
  </section>
</main>
<script>
  const byId = id => document.getElementById(id);
  const stateLabels = {
    idle: 'Chưa chạy', starting: 'Đang tải mô hình', warming_up: 'Đang tích lũy CSI',
    ready: 'Đang cập nhật', insufficient_data: 'Dữ liệu chưa đủ', incompatible: 'Sai cấu hình CSI',
    disconnected: 'Mất nguồn CSI', model_error: 'Lỗi mô hình', source_error: 'Lỗi bản ghi',
    ended: 'Đã phát lại xong', stopped: 'Đã dừng',
  };
  const edges = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],
    [23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
  let sessionId = null;

  function clearResult() {
    byId('pose').replaceChildren();
    byId('chart').replaceChildren();
    byId('chart-range').textContent = '';
    byId('presence').textContent = 'Chưa có kết quả';
  }

  function draw(target, tag, attrs) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    byId(target).append(element);
  }

  function render(message) {
    if (sessionId !== message.session_id) {
      sessionId = message.session_id;
      clearResult();
    }
    if (message.type === 'status') {
      const source = message.source === 'replay' ? 'Phát lại CSI đã lưu' : 'Thu CSI trực tiếp';
      byId('status').textContent = [source, stateLabels[message.status], message.reason].filter(Boolean).join(' · ');
      if (message.status !== 'ready') {
        clearResult();
        byId('detail').textContent = '';
      }
    } else if (message.type === 'chart') {
      const values = message.points.map(point => point.value);
      const min = Math.min(...values), max = Math.max(...values);
      const first = message.points[0].timestamp_ms;
      const last = message.points.at(-1).timestamp_ms;
      const points = message.points.map(point =>
        `${10 + 340 * (point.timestamp_ms - first) / Math.max(1, last - first)},${190 - 180 * (point.value - min) / (max - min || 1)}`);
      byId('chart').replaceChildren();
      draw('chart', 'polyline', {points: points.join(' '), fill: 'none', stroke: '#145d9c', 'stroke-width': 2});
      byId('chart-range').textContent = `${values.length} mẫu · Biên độ ${min.toFixed(1)}–${max.toFixed(1)}`;
    } else if (message.type === 'pose') {
      byId('detail').textContent = `CSI ${new Date(message.timestamp_ms).toLocaleTimeString('vi-VN')} · Model ${message.model_version} · Backend ${message.timing_ms.backend} ms`;
      byId('presence').textContent = `Mô hình dự đoán ${message.person_present ? 'có người' : 'không có người'} · Xác suất có người ${(100 * message.presence_probability).toFixed(1)}%`;
      byId('pose').replaceChildren();
      const joints = new Map(message.keypoints.map(joint => [joint.id, joint]));
      for (const [left, right] of edges) {
        const a = joints.get(left), b = joints.get(right);
        if (a && b) draw('pose', 'line', {x1: a.x_norm * 360, y1: a.y_norm * 202.5,
          x2: b.x_norm * 360, y2: b.y_norm * 202.5, stroke: '#145d9c', 'stroke-width': 2});
      }
      for (const joint of joints.values()) draw('pose', 'circle',
        {cx: joint.x_norm * 360, cy: joint.y_norm * 202.5, r: 2.1, fill: '#1b7875'});
    }
  }

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${location.host}/ws`);
    socket.onmessage = event => render(JSON.parse(event.data));
    socket.onclose = () => {
      clearResult();
      byId('detail').textContent = '';
      byId('status').textContent = 'Mất kết nối WebSocket · Đang kết nối lại';
      setTimeout(connect, 1000);
    };
  }

  for (const action of ['start', 'stop']) {
    byId(action).onclick = async () => {
      try {
        const response = await fetch(`/api/session/${action}`, {method: 'POST'});
        if (!response.ok) byId('detail').textContent = `Lệnh thất bại (HTTP ${response.status})`;
      } catch {
        byId('detail').textContent = 'Không kết nối được backend';
      }
    };
  }
  connect();
</script>
</html>
